button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:8px 8px;scrollbar-width:none}

.tab{flex:none;min-height:40px;padding:0 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-family:var(--disp);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap}

.search{display:flex;gap:8px;margin-bottom:8px}

.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px;padding:3px 3px 3px 9px;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:44px}

  },350);
}
function switchLocal(msg){ mode="local"; setMode(); if(unsubCart){unsubCart();unsubCart=null} if(unsubSent){unsubSent();unsubSent=null} if(unsubExtra){unsubExtra();unsubExtra=null} saveLocal(); if(msg) toast(msg); }
function setMode(){ const m=document.getElementById('mode'); m.textContent= mode==="shared"?"全端末で共有":(mode==="loading"?"読み込み中":"この端末だけ"); }

async function initDb(){
  mode="loading"; setMode(); loadLocal(); render();
  const C=(typeof window.claude==='object'&&window.claude&&typeof window.claude.use==='function')?window.claude:null;
  db=C?await C.use('db'):null;
  if(!db){ switchLocal(); return; }
  const user=await C.use('user');
  canWrite=user?(await user.can('data.write')):null;
  if(canWrite===false){ switchLocal('共有データに書き込めないアカウントなので、この端末だけに保存します'); return; }
  mode="shared"; cart={}; extra={}; setMode(); render();
  loadTimer=setTimeout(()=>{ stale=true; render(); },10000);
  unsubCart=db.collection('cart').onSnapshot(snap=>{
    const next={}; snap.docs.forEach(d=>{ if(!d.exists) return; const n=+d.id.slice(1); const v=d.data(); if(v&&v.q>0) next[n]={q:v.q,by:v.by||'',at:v.at||''}; });
    cart=next; if(!snap.metadata.fromCache){ clearTimeout(loadTimer); stale=false; } render();
  },err=>{ clearTimeout(loadTimer); switchLocal('共有データにつながらないので、この端末だけに保存します'); });
  unsubSent=db.collection('sent').orderBy('at','desc').limit(40).onSnapshot(snap=>{
    sent=snap.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data())); render();
  },err=>{});
  unsubExtra=db.collection('extra').onSnapshot(snap=>{
    const next={}; snap.docs.forEach(d=>{ if(!d.exists) return; const v=d.data(); if(v&&v.text) next[d.id]={sup:v.sup,text:v.text,by:v.by||'',at:v.at||''}; });
    extra=next; render();
  },err=>{});
}

// ---- helpers ----
function qty(n){ return cart[n]?cart[n].q:0; }
const STEP=(it)=>it.step||1;
function extrasOf(sup){ return Object.entries(extra).filter(([k,v])=>v.sup===sup).sort((a,b)=>(a[1].at||'').localeCompare(b[1].at||'')); }
function supCount(sup){ return ITEMS.filter(i=>i.sup===sup&&qty(i.n)>0).length+extrasOf(sup).length; }
function totalCount(){ return Object.keys(cart).filter(n=>BY[n]).length+Object.keys(extra).length; }
async function addExtra(sup,text){
  const id='x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const rec={sup:sup,text:text,by:who.value.trim(),at:new Date().toISOString()};
  extra[id]=rec; render();
  if(mode!=="shared"){ saveLocal(); return; }
  try{ await db.collection('extra').doc(id).set(rec); }
  catch(e){ if(e&&e.code==='invalid_argument'){ switchLocal('書き込みできないので、この端末だけに保存します'); } else { delete extra[id]; render(); toast('保存できませんでした。もう一度押してください'); } }
}
async function delExtra(id){
  delete extra[id]; render();
  if(mode!=="shared"){ saveLocal(); return; }
  try{ await db.collection('extra').doc(id).delete(); }catch(e){ toast('消せませんでした。もう一度押してください'); }
}
function fmtWhen(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let toastT; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
function orderText(sup){
  const s=SUPS.find(x=>x.id===sup); const lines=ITEMS.filter(i=>i.sup===sup&&qty(i.n)>0).map(i=>`・${i.name}${i.size&&!i.step?'（'+i.size+'）':''} × ${qty(i.n)}${UNIT(i)}`).concat(extrasOf(sup).map(([k,v])=>`・${v.text}`));
  const d=new Date(); const head=`【${s.label}】発注 ${d.getMonth()+1}/${d.getDate()}${who.value.trim()?'　担当：'+who.value.trim():''}`;
  return head+'\n'+lines.join('\n');
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast('コピーしました。LINEや注文画面に貼れます'); return true; }
  catch(e){ return false; }
}

// ---- render ----
const tabsEl=document.getElementById('tabs'), main=document.getElementById('main');
let filter='';
function renderTabs(){
  const defs=SUPS.map(s=>({t:TOKEN[s.id],label:s.label.replace(/（.*?）/,''),n:supCount(s.id)})).concat([{t:'matome',label:'まとめ',n:totalCount()},{t:'rireki',label:'履歴',n:0}]);
  tabsEl.innerHTML=defs.map(d=>`<button class="tab" role="tab" aria-selected="${view===d.t}" data-t="${d.t}">${esc(d.label)}<span class="n" ${d.n?'':'hidden'}>${d.n}</span></button>`).join('');
}
tabsEl.addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(!b) return; view=b.dataset.t; filter=''; render(); window.scrollTo(0,0); });
document.getElementById('goSum').addEventListener('click',()=>{ view='matome'; render(); window.scrollTo(0,0); });
document.getElementById('clearSup').addEventListener('click',()=>{ const sup=curSup(); if(!sup) return; ITEMS.filter(i=>i.sup===sup&&qty(i.n)>0).forEach(i=>writeQty(i.n,0)); extrasOf(sup).forEach(([k])=>delExtra(k)); toast('クリアしました'); });
function curSup(){ const e=Object.entries(TOKEN).find(([k,v])=>v===view); return e?e[0]:null; }

function renderSup(sup){
  const s=SUPS.find(x=>x.id===sup);
  const items=ITEMS.filter(i=>i.sup===sup&&(!filter||i.name.includes(filter)||(i.pname||'').includes(filter)));
  const groups=[['常温','room'],['冷蔵','chill'],['冷凍','frozen']].map(([k,c])=>[k,c,items.filter(i=>i.st===k)]).filter(g=>g[2].length);
  let h=`<div class="suphead"><h2>${esc(s.label)}</h2>${s.deadline?`<span class="dl">締切 ${esc(s.deadline)}</span>`:''}${s.how?`<span class="how">${esc(s.how)}</span>`:''}</div>`;
  if(items.length>12||filter) h+=`<div class="search"><input id="q" placeholder="品名で探す" value="${esc(filter)}" autocomplete="off"></div>`;
  if(stale&&mode==='shared') h+=`<div class="stale">共有データにまだつながっていません。表示が古いかもしれません。</div>`;
  groups.forEach(([k,c,list])=>{
    h+=`<section class="grp ${c}"><h3><i></i>${k}</h3><div class="list">`;
    let lastCat=null; const many=list.length>8;
    list.forEach(i=>{ const q=qty(i.n);
      if(many&&i.cat!==lastCat){ h+=`<div class="cat">${esc(i.cat||'')}</div>`; lastCat=i.cat; }
      const u=(q&&(i.step||UNIT(i)==='セット'))?`<small>${UNIT(i)}</small>`:'';
      h+=`<div class="row ${q?'on':''}" data-n="${i.n}"><div class="nm">${esc(i.name)}</div><div class="step"><button data-d="-1" aria-label="減らす">−</button><output>${q}${u}</output><button data-d="1" aria-label="増やす">＋</button></div></div>`;
    });
    h+=`</div></section>`;
  });
  if(!items.length&&filter) h+=`<div class="empty">該当する品がありません。下の「リストにないもの」に書けます</div>`;
  const ex=extrasOf(sup);
  h+=`<section class="extra"><h3>リストにないもの</h3><p>品名と数を書いて「追加」。例：オリーブ 2缶${sup==='その他'?'（店名も）':''}</p><form id="exf" autocomplete="off"><input id="ext" placeholder="品名と数" enterkeyhint="done"><button class="btn pri" type="submit">追加</button></form>`;
  if(ex.length) h+=`<ul>${ex.map(([k,v])=>`<li><span>${esc(v.text)}${v.by?`<small>${esc(v.by)}</small>`:''}</span><button data-xdel="${esc(k)}" aria-label="消す">消す</button></li>`).join('')}</ul>`;
  h+=`</section>`;
  main.innerHTML=h;
  const f=document.getElementById('exf'); f.addEventListener('submit',e=>{ e.preventDefault(); const t=document.getElementById('ext'); const v=t.value.trim(); if(!v) return; addExtra(sup,v); toast('追加しました'); });
  const qi=document.getElementById('q'); if(qi){ qi.addEventListener('input',()=>{ filter=qi.value.trim(); const pos=qi.selectionStart; renderSup(sup); const q2=document.getElementById('q'); if(q2){q2.focus(); q2.setSelectionRange(pos,pos);} }); }
}
main.addEventListener('click',e=>{
  const xd=e.target.closest('[data-xdel]'); if(xd){ delExtra(xd.dataset.xdel); return; }
  const row=e.target.closest('.row'); if(!row) return; const n=+row.dataset.n; const it=BY[n];
  const d=e.target.closest('[data-d]'); const last=e.target.closest('[data-last]');
  if(d){ writeQty(n,Math.max(0,qty(n)+(+d.dataset.d)*STEP(it))); return; }
  if(last){ const v=parseFloat(last.dataset.last)||1; writeQty(n,qty(n)===v?0:v); return; }
  if(e.target.closest('.nm')){ writeQty(n,qty(n)?0:STEP(it)); }
});

let confirmSup=null, showText=null;
function renderSummary(){
  const sups=SUPS.filter(s=>supCount(s.id)>0);
  let h=`<div class="suphead"><h2>まとめ</h2><span class="how">仕入先ごとに確認して、注文したら「注文した」を押す。履歴に残ります。</span></div>`;
  if(!sups.length){ h+=`<div class="empty"><b>まだ何も選んでいません</b>上の仕入先を開いて、足りないものの「＋」を押してください。</div>`; main.innerHTML=h; return; }
  sups.forEach(s=>{
    const list=ITEMS.filter(i=>i.sup===s.id&&qty(i.n)>0); const ex=extrasOf(s.id);
    h+=`<div class="card" data-sup="${esc(s.id)}"><h3>${esc(s.label)}<small>${s.deadline?'締切 '+esc(s.deadline):''}</small></h3>${s.how?`<div class="how">${esc(s.how)}</div>`:''}<ol>`;
    list.forEach(i=>{ const sub=[i.step?'':i.size,i.pname,i.last?'前回 '+i.last:''].filter(Boolean).join('　'); h+=`<li><span>${esc(i.name)}${sub?'<span class="sz">'+esc(sub)+'</span>':''}</span><span class="q">× ${qty(i.n)}${UNIT(i)}</span></li>`; });
    ex.forEach(([k,v])=>{ h+=`<li><span><span class="x">記入</span>${esc(v.text)}</span><span class="q"></span></li>`; });
    h+=`</ol><div class="acts"><button class="btn sm" data-act="copy">テキストをコピー</button><button class="btn sm" data-act="back">直す</button><button class="btn sm pri" data-act="done">注文した</button><span class="note">${list.length+ex.length}品</span></div>`;
    if(showText===s.id) h+=`<textarea class="copybox" readonly id="tx-${esc(TOKEN[s.id])}">${esc(orderText(s.id))}</textarea><div class="how">コピーできない端末では、上の文を長押しして選択してください。</div>`;
    if(confirmSup===s.id) h+=`<div class="confirm"><span>${esc(s.label)}の${list.length+ex.length}品を「注文済み」にして、この一覧から消しますか？</span><button class="btn sm pri" data-act="done-yes">はい、注文した</button><button class="btn sm" data-act="done-no">やめる</button></div>`;
    h+=`</div>`;
  });
  main.innerHTML=h;
}
main.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const card=b.closest('.card'); const sup=card&&card.dataset.sup; const act=b.dataset.act;
  if(act==='copy'){ const ok=await copyText(orderText(sup)); if(!ok){ showText=sup; renderSummary(); const t=document.getElementById('tx-'+TOKEN[sup]); if(t){t.focus();t.select();} } return; }
  if(act==='back'){ view=TOKEN[sup]; render(); window.scrollTo(0,0); return; }
  if(act==='done'){ confirmSup=sup; renderSummary(); return; }
  if(act==='done-no'){ confirmSup=null; renderSummary(); return; }
  if(act==='done-yes'){ confirmSup=null; await markSent(sup); return; }
});
async function markSent(sup){
  const list=ITEMS.filter(i=>i.sup===sup&&qty(i.n)>0); const ex=extrasOf(sup);
  const rec={sup:sup,at:new Date().toISOString(),by:who.value.trim(),lines:list.map(i=>({name:i.name,q:qty(i.n),unit:UNIT(i)})).concat(ex.map(([k,v])=>({name:v.text,q:'',unit:''}))),text:orderText(sup)};
  if(mode==='shared'){
    try{ await db.collection('sent').add(rec); for(const i of list){ delete cart[i.n]; await db.collection('cart').doc('i'+i.n).delete(); } for(const [k] of ex){ delete extra[k]; await db.collection('extra').doc(k).delete(); } }
    catch(err){ toast('保存できませんでした。もう一度押してください'); render(); return; }
  }else{ sent.unshift(Object.assign({id:'l'+Date.now()},rec)); list.forEach(i=>delete cart[i.n]); ex.forEach(([k])=>delete extra[k]); saveLocal(); }
  toast(SUPS.find(s=>s.id===sup).label+'を注文済みにしました'); render();
}
function renderHistory(){
  let h=`<div class="suphead"><h2>履歴</h2><span class="how">「注文した」を押した記録。新しい順。</span></div>`;
  if(!sent.length){ h+=`<div class="empty"><b>まだ履歴がありません</b>まとめで「注文した」を押すとここに残ります。</div>`; main.innerHTML=h; return; }
  h+=`<div class="card hist"><ol>`;
  sent.forEach(r=>{ const s=SUPS.find(x=>x.id===r.sup); h+=`<li><span class="when">${esc(fmtWhen(r.at))}<br>${esc(r.by||'')}</span><span class="lines"><b>${esc(s?s.label:r.sup)}</b><br>${(r.lines||[]).map(l=>esc(l.name)+(l.q!==''&&l.q!=null?'×'+esc(l.q)+esc(l.unit||''):'')).join('、')}</span><button class="btn sm" data-hcopy="${esc(r.id)}">コピー</button></li>`; });
  h+=`</ol></div>`; main.innerHTML=h;
}
main.addEventListener('click',async e=>{ const b=e.target.closest('[data-hcopy]'); if(!b) return; const r=sent.find(x=>x.id===b.dataset.hcopy); if(r){ const ok=await copyText(r.text||''); if(!ok) toast('この端末ではコピーできません'); } });

function render(){
  renderTabs();
  const sup=curSup();
  if(view==='matome') renderSummary(); else if(view==='rireki') renderHistory(); else if(sup) renderSup(sup); else { view='maruto'; renderSup('マルト'); }
  const t=totalCount(); const bs=document.getElementById('barsum');
  if(sup){ const c=supCount(sup); bs.innerHTML= c?`${esc(SUPS.find(s=>s.id===sup).label.replace(/（.*?）/,''))} <b>${c}</b> 品　／　全体 <b>${t}</b> 品`:`この仕入先はまだ0品　／　全体 <b>${t}</b> 品`; document.getElementById('clearSup').hidden=!c; }
  else { bs.innerHTML= t?`選んだ品 <b>${t}</b>`:'まだ何も選んでいません'; document.getElementById('clearSup').hidden=true; }
  document.getElementById('goSum').hidden=(view==='matome');
}
window.addEventListener('hashchange',()=>{ const v=location.hash.replace('#',''); if(v){ view=v; render(); } });
render();
initDb();
})();
</script>
</body></html>
